name: Build Release Artifacts

on:
  push:
    tags: ["*"]
  pull_request:
    branches: ["master"]

jobs:
  release:
    name: cargo release
    environment: build release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@master
        with:
          # keep in sync with src-tauri/rust-toolchain
          toolchain: nightly-2026-10-01

      - run: bun install --linker=isolated
      # only releases sign the updater artifacts; pull requests build without the signing secrets
      - run: bun run --bun tauri build
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - run: bun run --bun tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash

      # pull requests only verify the build; releases are published for tags only
      - run: 7z a -tzip LeagueRecord_${{ github.ref_name }}_x64_en-US.zip LeagueRecord.exe ../libobs licenses LICENSE.txt
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: ./src-tauri/target/release/

      - uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          artifacts: "./src-tauri/target/release/*.zip, ./src-tauri/target/release/bundle/nsis/*"
          prerelease: true
          body: |
            Windows-x64 installer and portable version.
            The \"portable\" requires a version of the webview2 runtime to be installed and won't work without it.
            Windows 11 should have the Webview2 runtime installed by default.
